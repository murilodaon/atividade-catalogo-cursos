databaseChangeLog:
  - changeSet:
      id: 002-create-curso
      author: grupo
      changes:
        - createTable:
            tableName: curso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: titulo
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: carga_horaria
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: nivel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: instrutor_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: curso
            baseColumnNames: instrutor_id
            referencedTableName: instrutor
            referencedColumnNames: id
            constraintName: fk_curso_instrutor
      rollback:
        - dropTable:
            tableName: curso
